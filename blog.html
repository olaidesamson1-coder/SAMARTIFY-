                content: `Embroidery machines come in various types, each designed for specific purposes. Whether you're starting your embroidery journey or expanding your capabilities, understanding machine types is crucial.

Single-Needle Machines: Perfect for home users and small businesses. These machines handle one thread at a time, making them versatile for small designs and detailed work. They're affordable, compact, and ideal for learning embroidery basics.

Multi-Needle Machines: Ideal for creating designs with multiple colors efficiently. With 4-15 needles, these machines allow color changes without stopping, significantly reducing production time. Great for commercial operations.

Industrial Machines: Heavy-duty machines designed for high-volume production. They offer wide hooping areas, fast speeds (up to 1200 RPM), and can run continuously for extended periods. Essential for large-scale operations.

Home/Craft Machines: User-friendly options combining affordability with capability. Perfect for hobbyists and creative entrepreneurs starting their journey.

Key Features to Consider:
- Hoop size (larger hoops handle bigger designs)
- Stitches per minute (speed affects production)
- Built-in designs vs. design input capability
- Memory capacity for custom designs
- Automatic needle threading
- Thread tension control
- Free arm for cylindrical items

Choosing the right machine depends on your budget, project types, volume needs, and available space.`,

                content: `Thread quality dramatically affects your embroidery results. Choosing the wrong thread type can lead to breakage, poor color quality, and wasted designs.

Polyester Threads: The most popular choice for embroidery. Durable, colorfast, and resistant to fading. Polyester threads hold their sheen and work well with all fabric types. Perfect for commercial quality results.

Cotton Threads: Ideal for natural fiber embroidery and vintage aesthetics. Less shiny than polyester, providing a matte finish. Great for heirloom pieces but less durable in frequent-use items.

Rayon Threads: Luxurious, highly lustrous threads with excellent color vibrancy. Perfect for show-stopping designs. More delicate than polyester, requiring proper tension settings.

Metallic & Specialty Threads: Add sparkle and dimension. Include gold, silver, holographic, and glow-in-the-dark options. Require slower machine speeds and careful handling.

Selection Tips:
- Match thread weight to fabric weight
- Test colors on scrap fabric first
- Store threads in cool, dry places
- Use appropriate needle sizes
- Maintain consistent tension
- Keep thread quality consistent for uniform results

Investing in quality threads transforms your embroidery from amateur to professional looking.`,

                content: `Even experienced embroiderers encounter problems. Understanding common issues and their solutions saves time and materials.

Thread Breakage: Usually caused by incorrect tension, needle damage, or poor thread quality. Solutions: Check needle for bends or burrs, adjust tension gradually, use quality threads, ensure proper needle size for thread weight.

Bunching & Puckering: When stitches bunch under the fabric. Often from incorrect stabilizer choice or tension issues. Use appropriate stabilizer type for your fabric weight. Adjust top and bobbin tension evenly.

Loose Stitches: Typically caused by low tension or thread slipping. Increase tension gradually (small adjustments), check needle security, ensure thread feeds smoothly into tension discs.

Skipped Stitches: Usually indicates a dull needle or improper needle installation. Replace needles regularly (every 6-8 hours), ensure needle is fully inserted and locked, check needle for deflection.

Fraying Fabric: Stabilizer choice is critical. Use tear-away stabilizer for finished goods, cut-away for permanent backing needed items, water-soluble for delicate fabrics.

Design Puckering: Happens with dense designs on lightweight fabrics. Reduce stitch density, increase stabilizer weight, use proper underlay stitches, test on scrap fabric first.

Prevention Best Practices:
- Replace needles regularly
- Clean machine weekly
- Use quality stabilizers
- Test designs on scraps
- Maintain proper tension
- Keep machine serviced

Troubleshooting is part of embroidery mastery. Each problem solved improves your skills.`,

                content: `Professional embroidery designs require attention to technical and creative details. Whether you're designing for personal use or commercial purposes, these principles apply.

Design Complexity: Professional designs balance detail with practicality. Overly dense designs cause tension problems and longer stitching times. Typically, 70-150 stitches per square inch is ideal.

Stitch Density: Controls how close stitches are together. Higher density creates bolder colors but increases stitching time and fabric strain. Lower density produces lighter coverage but risks fabric show-through.

Underlay Stitches: Foundation stitches that prevent puckering and shifting. Pull compensate underlays support fill areas. Column underlays support long lines. Underlay stitches aren't visible in final design but crucial for quality.

File Formats: Different machines require different formats.
- EMB (Melco) - wide compatibility
- DST (Tajima) - standard format
- PES (Brother) - popular home machines
- JEF (Janome) - Janome machines
- EXP (Melco) - complex designs
- VIP (Husqvarna Viking)

Color Optimization: Use machine-compatible colors for accurate results. Test designs on intended fabrics. Consider thread limitations (not all colors available in all thread types).

Lettering & Text: Requires proper density and supporting stitches. Avoid thin, delicate fonts for embroidery. Minimum character size depends on machine capabilities.

Design Preparation:

- Test on sample fabric

                content: `Stabilizer choice is one of the most critical factors in successful embroidery. Incorrect stabilizer selection leads to puckering, bunching, and poor results.

Tear-Away Stabilizers: Removed by tearing away after embroidery. Perfect for finished garments and projects. Doesn't leave permanent backing. Ideal for knits and delicate fabrics. Most economical option.

Cut-Away Stabilizers: Remain permanently behind the design for extra support. Essential for stretchy fabrics and high-stitch-density designs. Required for items that experience stress (waistbands, edges). Creates stronger, more durable designs.

Water-Soluble Stabilizers: Dissolves completely in water after embroidery. Perfect for open designs, hoops items, and delicate fabrics. No residue left behind. Slightly more expensive but worth it for quality-conscious work.

Fusible Stabilizers: Bonds to fabric with heat. Prevents shifting during embroidery. Great for knits and lightweight fabrics. Can feel stiff if over-applied.

Selection Guide by Fabric Type:
- Cotton: Tear-away or cut-away
- Knits: Cut-away or fusible
- Delicate fabrics: Water-soluble

Stabilizer Weight Matters:

Application Techniques:

- Use adhesive spray for difficult hooping
- Layer stabilizers for extra support
- Remove excess after embroidery
- Test removal method on scrap fabric

Professional embroiderers always have multiple stabilizer types available. Investment in quality stabilizers transforms results.`,
                category: "Machine Guides",

        function BlogPage() {
            const [allPosts] = useState(BLOG_POSTS);
            const [displayedPosts, setDisplayedPosts] = useState(BLOG_POSTS.slice(0, 6));
            const [selectedPost, setSelectedPost] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCategory, setSelectedCategory] = useState("All");
            const [currentPage, setCurrentPage] = useState(1);

            const categories = ["All", ...new Set(BLOG_POSTS.map(post => post.category))];

            useEffect(() => {
                let filtered = allPosts;

                // Filter by category
                if (selectedCategory !== "All") {
                    filtered = filtered.filter(post => post.category === selectedCategory);
                }

                // Filter by search term
                if (searchTerm) {
                    filtered = filtered.filter(post =>
                        post.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        post.excerpt.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                setCurrentPage(1);
                setDisplayedPosts(filtered);
            }, [searchTerm, selectedCategory]);

            const featuredPosts = allPosts.slice(0, 3);
            const postsPerPage = 4;
            const startIndex = (currentPage - 1) * postsPerPage;
            const paginatedPosts = displayedPosts.slice(startIndex, startIndex + postsPerPage);
            const totalPages = Math.ceil(displayedPosts.length / postsPerPage);

            const handleSearch = (e) => {
                e.preventDefault();
            };

            return (
                <>
                    <Navigation />

                    <section className="hero">
                        <h1>Embroidery Knowledge Hub</h1>
                        <p>Master embroidery machines, design techniques, and business tips from industry experts. Get inspired and level up your skills.</p>
                    </section>

                    <div className="container">
                        {/* Featured Posts */}
                        <section className="featured-section">
                            <h2 className="section-title">⭐ Featured Articles</h2>
                            <div className="featured-grid">
                                {featuredPosts.map(post => (
                                    <div key={post.id} className="blog-card" onClick={() => setSelectedPost(post)}>
                                        <div className="blog-image">{post.emoji}</div>
                                        <div className="blog-content">
                                            <div className="blog-meta">
                                                <span className="blog-category">{post.category}</span>
                                                <span className="blog-date">{post.date}</span>
                                            </div>
                                            <h3 className="blog-title">{post.title}</h3>
                                            <p className="blog-excerpt">{post.excerpt}</p>
                                            <div className="blog-footer">
                                                <div className="blog-author">
                                                    <div className="blog-author-avatar">{post.author.charAt(0)}</div>
                                                    <div>{post.author}</div>
                                                </div>
                                                <a href="#" className="read-more">{post.readTime} →</a>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Search & Filter */}
                        <div className="blog-controls">
                            <form className="search-box" onSubmit={handleSearch}>
                                <input 
                                    type="text" 
                                    placeholder="Search articles..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                                <button type="submit">Search</button>
                            </form>
                            <div className="category-filter">
                                {categories.map(cat => (
                                    <button 
                                        key={cat}
                                        className={`filter-btn ${selectedCategory === cat ? 'active' : ''}`}
                                        onClick={() => setSelectedCategory(cat)}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Blog List */}
                        <section className="blog-list">
                            <h2 className="section-title">📚 Latest Articles</h2>
                            
                            {paginatedPosts.length > 0 ? (
                                <>
                                    {paginatedPosts.map(post => (
                                        <div 
                                            key={post.id} 
                                            className="blog-list-item"
                                            onClick={() => setSelectedPost(post)}
                                        >
                                            <div className="blog-list-image">{post.emoji}</div>
                                            <div className="blog-list-content">
                                                <div>
                                                    <div className="blog-meta">
                                                        <span className="blog-category">{post.category}</span>
                                                        <span className="blog-date">{post.date}</span>
                                                        <span>{post.readTime}</span>
                                                    </div>
                                                    <h3 className="blog-title">{post.title}</h3>
                                                    <p className="blog-excerpt">{post.excerpt}</p>
                                                </div>
                                                <div className="blog-footer">
                                                    <div className="blog-author">
                                                        <div className="blog-author-avatar">{post.author.charAt(0)}</div>
                                                        <span>{post.author}</span>
                                                    </div>
                                                    <a href="#" className="read-more">Read Full Article →</a>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </>
                            ) : (
                                <div className="empty-state">
                                    <div className="empty-state-icon">🔍</div>
                                    <h3>No Articles Found</h3>
                                    <p>Try adjusting your search or filter criteria.</p>
                                </div>
                            )}

                            {/* Pagination */}
                            {totalPages > 1 && (
                                <div className="pagination">
                                    {Array.from({ length: totalPages }, (_, i) => i + 1).map(page => (
                                        <button 
                                            key={page}
                                            className={`pagination-btn ${currentPage === page ? 'active' : ''}`}
                                            onClick={() => {
                                                setCurrentPage(page);
                                                window.scrollTo({ top: 0, behavior: 'smooth' });
                                            }}
                                        >
                                            {page}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </section>

                        {/* Newsletter */}
                        <section className="newsletter-section">
                            <h2>📧 Stay Updated</h2>
                            <p>Get weekly embroidery tips, design trends, and exclusive discounts delivered to your inbox.</p>
                            <form className="newsletter-form" onSubmit={(e) => {
                                e.preventDefault();
                                alert('Thank you for subscribing! Check your email for confirmation.');
                            }}>
                                <input type="email" placeholder="Enter your email" required />
                                <button type="submit">Subscribe</button>
                            </form>
                        </section>
                    </div>

                    {/* Blog Post Modal */}
                    {selectedPost && (
                        <div className="modal active" onClick={() => setSelectedPost(null)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close" onClick={() => setSelectedPost(null)}>×</button>
                                
                                <div className="blog-full-image">{selectedPost.emoji}</div>
                                
                                <h1 className="blog-full-title">{selectedPost.title}</h1>
                                
                                <div className="blog-full-meta">
                                    <span>📅 {selectedPost.date}</span>
                                    <span>✍️ {selectedPost.author}</span>
                                    <span>🏷️ {selectedPost.category}</span>
                                    <span>⏱️ {selectedPost.readTime}</span>
                                </div>

                                <div className="blog-full-content" dangerouslySetInnerHTML={{
                                    __html: selectedPost.content
                                        .split('\n\n')
                                        .map((para, i) => {
                                            // Handle headings (lines in all caps or ending with colon)
                                            if (para.match(/^[A-Z][A-Za-z\s&:()-]+:?$/)) {
                                                return `<h3>${para}</h3>`;
                                            }
                                            // Handle lists
                                            if (para.includes('-') && para.split('\n').length > 2) {
                                                const items = para.split('\n').filter(l => l.trim().startsWith('-')).map(l => `<li>${l.replace(/^-\s*/, '')}</li>`);
                                                return `<ul>${items.join('')}</ul>`;
                                            }
                                            return `<p>${para}</p>`;
                                        })
                                        .join('')
                                }} />

                                <div className="blog-social">
                                    <button className="social-btn" onClick={() => alert('Share on Twitter')}>Share on Twitter</button>
                                    <button className="social-btn" onClick={() => alert('Share on Facebook')}>Share on Facebook</button>
                                    <button className="social-btn" onClick={() => alert('Share on Pinterest')}>Share on Pinterest</button>
                                </div>

                                <div style={{marginTop: '2rem', padding: '1.5rem', background: 'var(--light-sage)', borderRadius: '8px'}}>
                                    <strong>About the Author</strong>
                                    <p style={{marginTop: '0.5rem'}}>{selectedPost.author} is an experienced embroidery professional with expertise in {selectedPost.category.toLowerCase()}. Passionate about sharing knowledge and helping others master their craft.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer>
                        <p>&copy; 2026 SamArtify. All rights reserved. | <a href="policies.html" style={{color: 'var(--gold)', textDecoration: 'none'}}>Policies</a> | <a href="refund-policy.html" style={{color: 'var(--gold)', textDecoration: 'none'}}>Refunds</a> | <a href="contact.html" style={{color: 'var(--gold)', textDecoration: 'none'}}>Contact</a></p>
                        <div className="footer-social">
                            <a className="social-icon facebook" href="https://facebook.com/samartify" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M22 12a10 10 0 10-11.5 9.9v-7h-2.2v-2.9h2.2V9.4c0-2.2 1.3-3.4 3.3-3.4.96 0 1.96.17 1.96.17v2.1h-1.06c-1.04 0-1.36.65-1.36 1.32v1.6h2.32l-.37 2.9h-1.95v7A10 10 0 0022 12z"/></svg>
                            </a>
                            <a className="social-icon instagram" href="https://instagram.com/samartify" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm5 6.1A4.9 4.9 0 1016.9 13 4.9 4.9 0 0012 8.1zm5.2-2.3a1.2 1.2 0 11-1.2-1.2 1.2 1.2 0 011.2 1.2z"/></svg>
                            </a>
                            <a className="social-icon tiktok" href="https://www.tiktok.com/@samartify" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17.5 6.5a4 4 0 01-4-4v9a5 5 0 11-5-5v2.1a2.9 2.9 0 102.9 2.9V6.5h4.1z"/></svg>
                            </a>
                            <a className="social-icon youtube" href="https://www.youtube.com/c/samartify" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 15l5.2-3L10 9v6zm12-3c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v0c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v0z"/></svg>
                            </a>
                        </div>
                    </footer>
                </>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BlogPage />);
    </script>
</body>
</html>
